# ~/.config/tmux/themes/catppuccin_mocha.conf

set -g status-style "fg=#CDD6F4,bg=default"
set -g status-left "#[fg=#89B4FA]   #[fg=#CDD6F4] #S "
set -g status-left-length 20
set -g status-right "#[fg=#89B4FA]  %H:%M #[fg=#89B4FA]  %d-%b-%Y "
set -g status-right-length 50

set -g window-status-style "fg=#585B70,bg=default"
set -g window-status-current-style "fg=#89B4FA,bold,bg=default"
set -g window-status-format "#I:#W "
set -g window-status-current-format "#I:#W "

set -g pane-border-style "fg=#585B70"
set -g pane-active-border-style "fg=#89B4FA"

set -g display-panes-colour "#CDD6F4"
set -g display-panes-active-colour "#89B4FA"

set -g message-style "fg=#CDD6F4,bg=default"
set -g message-command-style "fg=#CDD6F4,bg=default"

set -g mode-style "fg=#89B4FA,bg=default"
