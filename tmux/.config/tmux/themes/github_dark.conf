# ~/.config/tmux/themes/github_dark.conf

set -g status-style "fg=#C9D1D9,bg=default"
set -g status-left "#[fg=#58A6FF]   #[fg=#C9D1D9] #S "
set -g status-left-length 20
set -g status-right "#[fg=#58A6FF]  %H:%M #[fg=#58A6FF]  %d-%b-%Y "
set -g status-right-length 50

set -g window-status-style "fg=#8B949E,bg=default"
set -g window-status-current-style "fg=#58A6FF,bold,bg=default"
set -g window-status-format "#I:#W "
set -g window-status-current-format "#I:#W "

set -g pane-border-style "fg=#8B949E"
set -g pane-active-border-style "fg=#58A6FF"

set -g display-panes-colour "#C9D1D9"
set -g display-panes-active-colour "#58A6FF"

set -g message-style "fg=#C9D1D9,bg=default"
set -g message-command-style "fg=#C9D1D9,bg=default"

set -g mode-style "fg=#58A6FF,bg=default"
