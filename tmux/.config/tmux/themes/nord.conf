# ~/.config/tmux/themes/nord.conf

set -g status-style "fg=#D8DEE9,bg=default"
set -g status-left "#[fg=#81A1C1]   #[fg=#D8DEE9] #S "
set -g status-left-length 20
set -g status-right "#[fg=#81A1C1]  %H:%M #[fg=#81A1C1]  %d-%b-%Y "
set -g status-right-length 50

set -g window-status-style "fg=#4C566A,bg=default"
set -g window-status-current-style "fg=#81A1C1,bold,bg=default"
set -g window-status-format "#I:#W "
set -g window-status-current-format "#I:#W "

set -g pane-border-style "fg=#4C566A"
set -g pane-active-border-style "fg=#81A1C1"

set -g display-panes-colour "#D8DEE9"
set -g display-panes-active-colour "#81A1C1"

set -g message-style "fg=#D8DEE9,bg=default"
set -g message-command-style "fg=#D8DEE9,bg=default"

set -g mode-style "fg=#81A1C1,bg=default"
